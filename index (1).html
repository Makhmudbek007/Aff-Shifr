<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аффинный шифр</title>
<link rel="stylesheet" href="style.css">
<!-- скрипт Телеграма, нужен только когда сайт открыт как мини-приложение -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main>

  <h1>Аффинный шифр</h1>
  <p class="sub">Практическая работа №1. Формула шифрования: E(x) = (a·x + b) mod m</p>

  <!-- блок с настройками -->
  <section class="panel">
    <span class="label">Алфавит (берётся из файла abc.txt)</span>
    <div class="alphabet" id="alphabet">Загрузка...</div>
    <p class="note" id="alphabetNote"></p>

    <div class="row">
      <div>
        <label for="keyA">Ключ a</label>
        <input id="keyA" type="number" value="13">
      </div>
      <div>
        <label for="keyB">Ключ b</label>
        <input id="keyB" type="number" value="5">
      </div>
    </div>

    <label for="lengthM">Длина алфавита m (считается сама)</label>
    <input id="lengthM" readonly>

    <label for="inputText" class="space">Текст</label>
    <textarea id="inputText" spellcheck="false">Maxsudov Maxmudbek</textarea>

    <div class="buttons">
      <button id="btnEncrypt" class="active">Зашифровать</button>
      <button id="btnDecrypt">Расшифровать</button>
      <button id="btnSwap">Результат → в текст</button>
    </div>

    <p class="error" id="error"></p>
  </section>

  <!-- результат -->
  <section class="panel">
    <h2>Результат</h2>
    <div class="formula" id="formula"></div>
    <div class="result" id="result"></div>
  </section>

  <!-- таблица с решением -->
  <section class="panel">
    <h2>Решение по шагам</h2>
    <div class="table-wrap">
      <table id="steps"></table>
    </div>
    <p class="note">Символы, которых нет в алфавите (например пробел), остаются как есть.</p>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
